<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 2 Vocabulary Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .vocab-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }
        .gemini-output {
            transition: max-height 0.5s ease-in-out;
            max-height: 0;
            overflow: hidden;
        }
        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-4 sm:p-6 md:p-8">
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900">Unit 2 Vocabulary Showcase</h1>
            <p class="mt-3 text-lg text-gray-600">A visual guide to the key words in "What is the value of MONEY?". Try the interactive features on each card!</p>
        </header>

        <!-- Money and Trade Section -->
        <section class="mb-12">
            <h2 class="text-3xl font-bold border-b-4 border-blue-500 pb-2 mb-6">Money and Trade</h2>
            <div id="money-trade-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Cards will be injected by JavaScript -->
            </div>
        </section>

        <!-- Compound Adjectives Section -->
        <section class="mb-12">
            <h2 class="text-3xl font-bold border-b-4 border-green-500 pb-2 mb-6">Compound Adjectives</h2>
            <div id="compound-adjectives-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Cards will be injected by JavaScript -->
            </div>
        </section>

        <!-- World Problems and Solutions Section -->
        <section>
            <h2 class="text-3xl font-bold border-b-4 border-purple-500 pb-2 mb-6">World Problems and Solutions</h2>
            <div id="world-problems-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Cards will be injected by JavaScript -->
            </div>
        </section>

    </div>

    <script>
        const vocabData = {
            moneyTrade: [
                { word: 'barter', definition: 'to trade items without using money', imageUrl: 'https://cdn.prod.website-files.com/6580bf6203485cf15c72a4f1/658f6f9f60c313eea30c9517_62ce166c87251635d37b9371_621f0dbcbed9c1457dd4ebd5_1280-186187368-barter.jpeg' },
                { word: 'bill', definition: 'a piece of paper money', imageUrl: 'https://www.alliantcreditunion.org/images/uploads/images/Dollar-Bill-Dimensions.jpg' },
                { word: 'checkout counter', definition: 'the place in a store where you pay', imageUrl: 'https://www.shelvingdepot.com/wp-content/uploads/2018/08/Gondola-Checkout-Counter.jpg' },
                { word: 'consumer', definition: 'a person who buys goods or services', imageUrl: 'https://www.salesforce.com/blog/wp-content/uploads/sites/2/2022/12/GettyImages-1452145403.jpg?w=750' },
                { word: 'currency', definition: 'the type of money used in a country', imageUrl: 'https://i.ytimg.com/vi/GjvLkkA3wgw/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLAUKo31Nr0YmTfYxATc4K0vKN1_3A' },
                { word: 'deal', definition: 'a special price or agreement', imageUrl: 'https://cdn.corporatefinanceinstitute.com/assets/business-deal.jpeg' },
                { word: 'goods', definition: 'items or products that are for sale', imageUrl: 'https://cdn1.ieltsonlinetests.com/hu-kCKE--621x414%40LiveMint.jpg' },
                { word: 'negotiate', definition: 'to discuss to reach an agreement', imageUrl: 'https://www.insidehighered.com/sites/default/files/styles/max_650x650/public/media/GettyImages-1209776844.jpg?itok=P1SWIlM5' },
                { word: 'swap', definition: 'to exchange one thing for another', imageUrl: 'https://bymmb.com/wp-content/uploads/2014/03/swap-nedir.jpg' },
                { word: 'transaction', definition: 'the action of buying or selling', imageUrl: 'https://www.tgccpa.com/wp-content/uploads/2019/02/AdobeStock_115802339_r-min.jpg' }
            ],
            compoundAdjectives: [
                { word: 'hard-to-resist', definition: 'very tempting or difficult to say no to', imageUrl: 'https://scontent.fsaw3-1.fna.fbcdn.net/v/t39.30808-6/474223303_3864214073826748_3580515620733815347_n.jpg?stp=dst-jpg_s640x640_tt6&_nc_cat=105&ccb=1-7&_nc_sid=833d8c&_nc_ohc=yMx0wsKmlbcQ7kNvwG6RHE_&_nc_oc=AdkMQ37HfDz4IuweQrfud3Nx0UpWj9v8nE3mIzPyr9GN3FLDvlyzZ4JXusdhsYNOG8E&_nc_zt=23&_nc_ht=scontent.fsaw3-1.fna&_nc_gid=-Wzx7Qmhh-6S-IFfpdomNw&oh=00_AfXJr2CoXyebivNPfg6zolj9i4XYQlStn5dhPnsQX_wuXA&oe=689917CF' },
                { word: 'high-tech', definition: 'using very modern technology', imageUrl: 'https://www.ict.eu/sites/corporate/files/images/Header-expertise-High-Tech-1920x867.jpg' },
                { word: 'must-have', definition: 'something very popular you feel you need', imageUrl: 'https://theholdernessfamily.com/wp-content/uploads/2022/06/summer-must-haves.png' },
                { word: 'overnight', definition: 'happening very suddenly or quickly', imageUrl: 'https://quotefancy.com/media/wallpaper/1600x900/1980186-Paula-Deen-Quote-Change-doesn-t-happen-overnight-It-starts-with.jpg' },
                { word: 'sky-high', definition: 'extremely high (usually for prices)', imageUrl: 'https://i.redd.it/usaj20xfmotc1.png' },
                { word: 'worldwide', definition: 'happening all over the world', imageUrl: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTluIRueSUbZKOS9eDqd62yB9SrEjr971jBoA&s' }
            ],
            worldProblems: [
                { word: 'benefit', definition: 'a helpful or good effect', imageUrl: 'https://www.flexjobs.com/employer-blog/wp-content/uploads/2020/01/27163418/benefit-trends.png' },
                { word: 'damage', definition: 'harm or injury caused to something', imageUrl: 'https://www.firstatlanticfire.com/wp-content/uploads/2021/05/page-header-wind-damage.jpg' },
                { word: 'deserve', definition: 'to have earned something', imageUrl: 'https://cdn.langeek.co/photo/43494/original/?type=jpeg' },
                { word: 'potential', definition: 'the possibility of future development', imageUrl: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfHkJ8Q-7UIi9d_Y5TOmZSqT1axreRVAbiPg&s' },
                { word: 'poverty', definition: 'the state of being extremely poor', imageUrl: 'https://images.eu.ctfassets.net/8n7i7n887l2e/6SL0DdTBt5Uw99SOMdLPus/72cd186b0373699427d3f85e1fcfcc14/Poverty-what-is-poverty-1.jpg' },
                { word: 'priority', definition: 'the thing that is most important', imageUrl: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlQLPCb4m7lgFMceKoI7QfFsjjA0ZflsD8Uw&s' },
                { word: 'social enterprise', definition: 'a business created to solve social problems', imageUrl: 'https://www.bigissue.com/wp-content/uploads/2017/09/Social_Enterprise.jpg' },
                { word: 'transform', definition: 'to change something completely', imageUrl: 'https://media.istockphoto.com/id/1417761158/tr/foto%C4%9Fraf/success-transformation.jpg?s=612x612&w=0&k=20&c=QG4T3uFIejrGIPExbcDaPdFcyJbd81EYDOxZEcFpjS8=' },
                { word: 'vaccination', definition: 'a shot to protect against a disease', imageUrl: 'https://www.phc.ox.ac.uk/images/blog/covid-vaccines-in-children/responsive_image?ratio=r16x9&scale=w760' }
            ]
        };

        function createVocabCard(item) {
            const card = document.createElement('div');
            card.className = 'vocab-card bg-white rounded-lg shadow-md overflow-hidden flex flex-col';
            
            card.innerHTML = `
                <img src="${item.imageUrl}" alt="${item.word}" class="w-full h-40 object-cover" onerror="this.onerror=null;this.src='https://placehold.co/600x400/cccccc/ffffff?text=Image+Not+Found';">
                <div class="p-4 flex flex-col flex-grow">
                    <h3 class="text-xl font-bold">${item.word}</h3>
                    <p class="text-gray-600 mt-1">${item.definition}</p>
                    <button class="gemini-btn mt-4 w-full bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-purple-700 transition-colors duration-200">
                        ✨ Explain & Example
                    </button>
                    <div class="gemini-output bg-purple-50 p-3 mt-3 rounded-lg">
                        <div class="loader-container" style="display: none;"><div class="loader"></div></div>
                        <div class="content-container text-sm text-gray-700"></div>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-200 flex-grow flex flex-col">
                        <label class="font-semibold text-gray-700 mb-2">Practice with a sentence:</label>
                        <textarea class="sentence-input w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-400" rows="2" placeholder="Write your sentence here..."></textarea>
                        <button class="check-sentence-btn mt-2 w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors duration-200">
                            Check My Sentence
                        </button>
                        <div class="feedback-output bg-blue-50 p-3 mt-3 rounded-lg" style="display: none;">
                            <div class="loader-container" style="display: none;"><div class="loader"></div></div>
                            <div class="content-container text-sm text-gray-700"></div>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        function populateGrid(gridId, data) {
            const grid = document.getElementById(gridId);
            data.forEach(item => {
                grid.appendChild(createVocabCard(item));
            });
        }

        async function callGeminiWithExponentialBackoff(prompt, maxRetries = 5) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                    const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }] };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 429 || response.status >= 500) {
                            throw new Error(`API call failed with status: ${response.status}`);
                        } else {
                            const errorResult = await response.json();
                            return `Error: ${errorResult.error?.message || 'An unknown error occurred.'}`;
                        }
                    }

                    const result = await response.json();
                    if (result.candidates && result.candidates.length > 0 &&
                        result.candidates[0].content && result.candidates[0].content.parts &&
                        result.candidates[0].content.parts.length > 0) {
                        return result.candidates[0].content.parts[0].text;
                    } else {
                        return "Sorry, the model's response was empty.";
                    }
                } catch (error) {
                    if (i === maxRetries - 1) {
                        console.error("Gemini API call error after max retries:", error);
                        return "Sorry, an error occurred while trying to get a response. Please try again later.";
                    }
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            populateGrid('money-trade-grid', vocabData.moneyTrade);
            populateGrid('compound-adjectives-grid', vocabData.compoundAdjectives);
            populateGrid('world-problems-grid', vocabData.worldProblems);

            document.addEventListener('click', async (e) => {
                if (e.target.classList.contains('gemini-btn')) {
                    const button = e.target;
                    const card = button.closest('.vocab-card');
                    const word = card.querySelector('h3').textContent;
                    const definition = card.querySelector('p').textContent;
                    const outputDiv = card.querySelector('.gemini-output');
                    const loader = outputDiv.querySelector('.loader-container');
                    const content = outputDiv.querySelector('.content-container');

                    button.disabled = true;
                    button.classList.add('opacity-50', 'cursor-not-allowed');
                    
                    loader.style.display = 'block';
                    content.innerHTML = '';
                    outputDiv.style.maxHeight = '50px';

                    const prompt = `For the vocabulary word "${word}", which means "${definition}", do two things and format it exactly like this:\n\n**New Example:** [Write one new, creative example sentence here.]\n\n**Simple Explanation:** [Explain the word in a very simple way, like you're talking to a 10-year-old, maybe with an analogy.]`;

                    const response = await callGeminiWithExponentialBackoff(prompt);
                    
                    content.innerHTML = response.replace(/\n/g, '<br>');
                    loader.style.display = 'none';
                    outputDiv.style.maxHeight = outputDiv.scrollHeight + 'px';

                    button.disabled = false;
                    button.classList.remove('opacity-50', 'cursor-not-allowed');
                }

                if (e.target.classList.contains('check-sentence-btn')) {
                    const button = e.target;
                    const card = button.closest('.vocab-card');
                    const word = card.querySelector('h3').textContent;
                    const definition = card.querySelector('p').textContent;
                    const textarea = card.querySelector('.sentence-input');
                    const studentSentence = textarea.value;
                    const outputDiv = card.querySelector('.feedback-output');
                    const loader = outputDiv.querySelector('.loader-container');
                    const content = outputDiv.querySelector('.content-container');

                    if (studentSentence.trim() === '') {
                        content.textContent = 'Please write a sentence first.';
                        outputDiv.style.display = 'block';
                        return;
                    }

                    button.disabled = true;
                    button.classList.add('opacity-50', 'cursor-not-allowed');
                    
                    loader.style.display = 'block';
                    content.innerHTML = '';
                    outputDiv.style.display = 'block';

                    const prompt = `You are a friendly and encouraging English teacher. A student is practicing the vocabulary word "${word}", which means "${definition}". The student wrote the following sentence: "${studentSentence}". Please do two things: 1. Tell the student if they used the word correctly or not. 2. If it's correct, praise them and explain why it's a good sentence. If it's incorrect, gently explain the mistake and provide a corrected version of their sentence. Keep your feedback concise and positive.`;
                    
                    const response = await callGeminiWithExponentialBackoff(prompt);
                    
                    content.innerHTML = response.replace(/\n/g, '<br>');
                    loader.style.display = 'none';

                    button.disabled = false;
                    button.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });
        });
    </script>
</body>
</html>
